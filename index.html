<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FuelTek Dash</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        
        /* Fundo da tela (simulando o plástico do painel) */
        body { background-color: #222; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }

        /* O Painel em si (formato de tela centralizada) */
        .painel { 
            width: 100%; 
            max-width: 900px; 
            height: 100vh; 
            max-height: 600px;
            background-color: #050505; 
            border-radius: 30px; 
            border: 15px solid #111;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
            position: relative; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            color: white;
        }

        /* --- BARRA SUPERIOR (RPM) --- */
        .top-bar { display: flex; align-items: center; padding: 10px 20px; background: #000; border-bottom: 2px solid #111; }
        .rpm { font-size: 42px; font-weight: bold; color: #fff; letter-spacing: 1px;}
        .rpm-label { font-size: 14px; color: #888; margin-left: 5px; margin-top: 15px; font-weight: bold;}
        .rec { color: #ff0000; font-size: 14px; margin-left: auto; font-weight: bold; display: flex; align-items: center;}
        .rec-dot { width: 10px; height: 10px; background: #ff0000; border-radius: 50%; margin-right: 5px; animation: piscar 1s infinite; }
        @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Barra de RPM (Listras) */
        .rpm-bar { display: flex; height: 20px; background: #111; border-bottom: 1px solid #333; padding: 2px 10px; align-items: center;}
        .rpm-bar .yellow { background-color: #ffcc00; width: 40px; height: 100%; border-radius: 2px;}
        .rpm-bar .ticks { display: flex; flex: 1; justify-content: space-between; padding: 0 10px; font-size: 10px; color: #888; font-weight: bold;}
        .rpm-bar .ticks span { border-left: 1px solid #444; padding-left: 5px; }

        /* --- ÁREA CENTRAL (Textos e Velocidade) --- */
        .main-area { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; }
        
        .data-block { text-align: center; }
        .data-block .label { color: #ffcc00; font-size: 16px; font-weight: bold; margin-bottom: 5px;}
        .data-block .value { font-size: 48px; font-weight: bold; line-height: 1; font-family: 'Courier New', Courier, monospace;}
        
        .center-marcha { text-align: center; }
        .center-marcha .label { color: #ffcc00; font-size: 16px; font-weight: bold; margin-bottom: 5px;}
        .center-marcha .value { font-size: 80px; font-weight: bold; line-height: 0.8;}

        .data-speed { text-align: center; }
        .data-speed .label { color: #ffcc00; font-size: 16px; font-weight: bold; margin-bottom: 5px;}
        .data-speed .value { font-size: 80px; font-weight: bold; line-height: 0.8;}
        .data-speed .unit { font-size: 14px; color: #888; font-weight: bold; margin-top: 5px;}

        /* --- RODAPÉ (Caixas dos Sensores) --- */
        .sensor-footer { display: flex; justify-content: space-between; padding: 10px 15px; background: #000; border-top: 2px solid #111; gap: 5px;}
        
        .sensor-card { flex: 1; display: flex; flex-direction: column; }
        .sensor-header { display: flex; justify-content: space-between; color: #ffcc00; font-size: 12px; font-weight: bold; margin-bottom: 2px;}
        .sensor-val { font-size: 18px; font-weight: bold; margin-bottom: 5px; text-align: center;}
        
        /* Barras Customizadas */
        .bar-box { display: flex; border: 1px solid #333; height: 24px; background: #050505; }
        .bar-title { width: 45px; background: #222; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border-right: 1px solid #333;}
        .bar-bg { flex: 1; display: flex; padding: 2px; gap: 1px;}
        .bar-segment { flex: 1; background: #222; }
        
        /* Cores dos Sensores */
        .card-burnout .bar-segment.active { background: #ff0000; }
        .card-oleo .bar-segment.active { background: #00ff00; }
        .card-tanque .bar-segment.active { background: #00ff00; }
        .card-comb .bar-bg { flex-direction: column; gap: 2px;}
        .card-comb .bar-row { display: flex; flex: 1; gap: 1px; }
        .card-comb .bar-row .bar-segment { height: 100%;}
        .card-comb .bar-row .bar-segment.active { background: #ffaa00; }
        .card-motor .bar-segment.active { background: #00ff00; }

        /* --- TELA DO MAPA (Modal) --- */
        .modal-map { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 100; flex-direction: column; }
        
        .map-header { background: #00bfff; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold;}
        .map-header button { background: none; border: none; color: white; font-size: 24px; cursor: pointer;}
        
        .graph-container { flex: 1; position: relative; background: #000; margin: 10px; border: 1px solid #333; overflow: hidden;}
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair;}
        
        /* Controles Inferiores do Mapa */
        .map-controls { display: flex; flex-direction: column; padding: 10px; gap: 10px; background: #111; }
        .control-row { display: flex; justify-content: space-between; align-items: center; background: #222; border: 1px solid #444;}
        .control-row button { width: 50px; height: 40px; background: #333; border: none; color: white; font-size: 20px; font-weight: bold; cursor: pointer;}
        .control-row .display { flex: 1; text-align: center; font-size: 20px; font-weight: bold; font-family: 'Courier New', monospace;}
        
        .action-buttons { display: flex; gap: 10px; }
        .action-buttons button { flex: 1; padding: 15px; border: none; font-size: 24px; font-weight: bold; color: white; cursor: pointer; border-radius: 5px;}
        .btn-x { background: #ff0000; }
        .btn-v { background: #00cc00; }

        /* Botão Menu no topo */
        .btn-menu-top { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 8px 20px; background: #00bfff; color: #000; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; z-index: 10; font-size: 14px;}

    </style>
</head>
<body>

    <div class="painel">
        <!-- Barra Superior -->
        <div class="top-bar">
            <div class="rpm" id="rpmDisplay">0733</div>
            <div class="rpm-label">RPM</div>
            <button class="btn-menu-top" onclick="toggleMap()">Menu</button>
            <div class="rec"><div class="rec-dot"></div> REC</div>
        </div>

        <!-- Listras RPM -->
        <div class="rpm-bar">
            <div class="yellow"></div>
            <div class="ticks">
                <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
                <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
            </div>
        </div>

        <!-- Área Central -->
        <div class="main-area">
            <div class="data-block">
                <div class="label">P.Ignição</div>
                <div class="value">15.8°</div>
            </div>
            <div class="center-marcha">
                <div class="label">Marcha</div>
                <div class="value" id="gearDisplay">N</div>
            </div>
            <div class="data-speed">
                <div class="label">Velocidade</div>
                <div class="value" id="speedDisplay">0</div>
                <div class="unit">Km/h</div>
            </div>
        </div>

        <!-- Rodapé Sensores -->
        <div class="sensor-footer">
            <!-- Motor -->
            <div class="sensor-card card-burnout">
                <div class="sensor-header"><span>T.Motor</span><span>90.0</span></div>
                <div class="bar-box">
                    <div class="bar-title">Burnout</div>
                    <div class="bar-bg">
                        <div class="bar-segment active"></div><div class="bar-segment active"></div><div class="bar-segment active"></div>
                    </div>
                </div>
            </div>

            <!-- Óleo -->
            <div class="sensor-card card-oleo">
                <div class="sensor-header"><span>P.Óleo</span><span>5</span></div>
                <div class="bar-box">
                    <div class="bar-title">P.</div>
                    <div class="bar-bg">
                        <div class="bar-segment active"></div><div class="bar-segment"></div><div class="bar-segment"></div>
                    </div>
                </div>
            </div>

            <!-- Tanque -->
            <div class="sensor-card card-tanque">
                <div class="sensor-header"><span>Turbo</span><span>0.00</span></div>
                <div class="bar-box">
                    <div class="bar-title">Tanque</div>
                    <div class="bar-bg">
                        <div class="bar-segment active"></div><div class="bar-segment active"></div><div class="bar-segment"></div>
                    </div>
                </div>
            </div>

            <!-- Combustível -->
            <div class="sensor-card card-comb">
                <div class="sensor-header"><span>P.Comb</span><span>20</span></div>
                <div class="bar-box">
                    <div class="bar-bg">
                        <div class="bar-row">
                            <div class="bar-segment active"></div><div class="bar-segment active"></div><div class="bar-segment"></div>
                        </div>
                        <div class="bar-row">
                            <div class="bar-segment active"></div><div class="bar-segment"></div><div class="bar-segment"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ar -->
            <div class="sensor-card card-motor">
                <div class="sensor-header"><span>T.Ar</span><span>36.8</span></div>
                <div class="bar-box">
                    <div class="bar-title">Motor</div>
                    <div class="bar-bg">
                        <div class="bar-segment active"></div><div class="bar-segment active"></div><div class="bar-segment active"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- --- TELA DO MAPA --- -->
        <div class="modal-map" id="mapModal">
            <div class="map-header">
                <button onclick="toggleMap()">&lt;</button>
                <span>Mapa principal de injeção</span>
                <button onclick="toggleMap()">&gt;</button>
            </div>
            
            <div class="graph-container">
                <canvas id="mapCanvas"></canvas>
            </div>

            <!-- Controles de Edição -->
            <div class="map-controls">
                <div class="control-row">
                    <button onclick="changeSelectedValue(-1)">-</button>
                    <div class="display" id="mapBarDisplay">0.25 bar</div>
                    <button onclick="changeSelectedValue(1)">+</button>
                </div>
                <div class="control-row">
                    <button onclick="changeSelectedValue(-5)">-</button>
                    <div class="display" id="mapValueDisplay">21.2 %</div>
                    <button onclick="changeSelectedValue(5)">+</button>
                </div>
                
                <div class="action-buttons">
                    <button class="btn-x" onclick="toggleMap()">X</button>
                    <button class="btn-v" onclick="toggleMap()">V</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Lógica de Velocidade Real (GPS) ---
        let currentSpeed = 0;
        const speedDisplay = document.getElementById('speedDisplay');
        const gearDisplay = document.getElementById('gearDisplay');
        const rpmDisplay = document.getElementById('rpmDisplay');

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((position) => {
                let speedMps = position.coords.speed;
                if (speedMps !== null && speedMps !== undefined) {
                    currentSpeed = speedMps * 3.6; // m/s para km/h
                    speedDisplay.innerText = Math.round(currentSpeed);
                    
                    // Lógica Fake de Marcha e RPM
                    let marcha = Math.floor(currentSpeed / 20) + 1;
                    if (currentSpeed < 1) marcha = "N";
                    if (marcha > 6) marcha = 6;
                    gearDisplay.innerText = marcha;

                    if (currentSpeed > 0) {
                        let rpmFake = 1000 + ((currentSpeed % 20) * 150);
                        rpmDisplay.innerText = Math.round(rpmFake).toString().padStart(4, '0');
                    } else {
                        rpmDisplay.innerText = "0900";
                    }
                }
            }, (err) => console.warn(err), { enableHighAccuracy: true });
        }

        // --- 2. Lógica do Gráfico Interativo ---
        const mapModal = document.getElementById('mapModal');
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const mapValueDisplay = document.getElementById('mapValueDisplay');
        const mapBarDisplay = document.getElementById('mapBarDisplay');

        // Configuração do Gráfico
        const numPoints = 15; // Quantidade de bolinhas
        let points = [];      // Array que guarda a posição Y de cada bolinha
        let selectedPoint = 5; // Bolinha selecionada inicialmente (para usar os botões + e -)

        // Inicializa a curva (uma linha reta subindo)
        for (let i = 0; i < numPoints; i++) {
            // Gera uma curva inicial suave
            let initialY = 0.8 - (i * 0.04); 
            points.push(initialY);
        }

        function toggleMap() {
            if (mapModal.style.display === "flex") {
                mapModal.style.display = "none";
            } else {
                mapModal.style.display = "flex";
                resizeCanvas();
                drawGraph();
            }
        }

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }

        // Desenha o gráfico na tela
        function drawGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const paddingX = 20;
            const paddingY = 20;
            const graphWidth = canvas.width - (paddingX * 2);
            const graphHeight = canvas.height - (paddingY * 2);

            // Desenha Grade
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            for(let i=0; i<=10; i++) {
                let x = paddingX + (graphWidth / 10) * i;
                ctx.beginPath(); ctx.moveTo(x, paddingY); ctx.lineTo(x, canvas.height - paddingY); ctx.stroke();
            }
            for(let i=0; i<=5; i++) {
                let y = paddingY + (graphHeight / 5) * i;
                ctx.beginPath(); ctx.moveTo(paddingX, y); ctx.lineTo(canvas.width - paddingX, y); ctx.stroke();
            }
            ctx.setLineDash([]);

            // Desenha Barras de Fundo (Amarelo e Vermelho da foto)
            ctx.fillStyle = 'rgba(255, 204, 0, 0.2)';
            let barWidth = graphWidth / numPoints;
            ctx.fillRect(paddingX + (barWidth * 1), paddingY, barWidth, graphHeight);
            
            ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
            ctx.fillRect(paddingX + (barWidth * 3), paddingY, barWidth, graphHeight);

            // Desenha a Linha Verde
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.beginPath();

            for (let i = 0; i < numPoints; i++) {
                let x = paddingX + (graphWidth / (numPoints - 1)) * i;
                let y = paddingY + (points[i] * graphHeight);

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Desenha as Bolinhas
            for (let i = 0; i < numPoints; i++) {
                let x = paddingX + (graphWidth / (numPoints - 1)) * i;
                let y = paddingY + (points[i] * graphHeight);

                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = (i === selectedPoint) ? '#ffffff' : '#00ff00'; // Selecionada fica branca
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        // --- 3. Interação com o Gráfico (Arrastar e Botões) ---

        // Função para pegar a posição do toque/mouse e mover a bolinha
        function updatePointFromEvent(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            let mouseX = clientX - rect.left;
            let mouseY = clientY - rect.top;

            const paddingX = 20;
            const paddingY = 20;
            const graphWidth = canvas.width - (paddingX * 2);
            const graphHeight = canvas.height - (paddingY * 2);

            // Descobre qual bolinha foi tocada
            let closestIndex = 0;
            let minDistance = Infinity;

            for (let i = 0; i < numPoints; i++) {
                let x = paddingX + (graphWidth / (numPoints - 1)) * i;
                let y = paddingY + (points[i] * graphHeight);
                let dist = Math.hypot(mouseX - x, mouseY - y);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestIndex = i;
                }
            }

            // Se clicou perto de alguma bolinha, move ela
            if (minDistance < 40) {
                selectedPoint = closestIndex;
                let newY = (mouseY - paddingY) / graphHeight;
                // Limita entre 0 e 1
                newY = Math.max(0, Math.min(1, newY));
                points[selectedPoint] = newY;
                
                updateDisplays();
                drawGraph();
            }
        }

        // Eventos de mouse e toque no canvas
        canvas.addEventListener('mousedown', updatePointFromEvent);
        canvas.addEventListener('mousemove', (e) => { if(e.buttons === 1) updatePointFromEvent(e); });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); updatePointFromEvent(e); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); updatePointFromEvent(e); }, {passive: false});

        // Função para os botões + e -
        function changeSelectedValue(amount) {
            // Converte o valor de +/- para a escala do gráfico (0 a 1)
            // Ex: +/- 1 altera 0.02 no gráfico
            let change = amount * 0.02;
            points[selectedPoint] -= change; 
            
            // Limita entre 0 e 1
            points[selectedPoint] = Math.max(0, Math.min(1, points[selectedPoint]));
            
            updateDisplays();
            drawGraph();
        }

        // Atualiza os textos de valor baseado na bolinha selecionada
        function updateDisplays() {
            // Inverte o valor Y para a porcentagem (Y=0 é 100%, Y=1 é 0%)
            let percent = (1 - points[selectedPoint]) * 100;
            let bar = (percent / 100) * 1.5;

            mapValueDisplay.innerText = percent.toFixed(1) + " %";
            mapBarDisplay.innerText = bar.toFixed(2) + " bar";
        }

        // Inicializa os textos
        updateDisplays();
    </script>
</body>
</html>
